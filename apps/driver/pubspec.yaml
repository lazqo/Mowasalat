name: mowasalat_driver
description: The Mowasalat driver app — تطبيق السائق.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  mowasalat_core:
    path: ../../packages/core

  # Deliberately few. Each one is app size and battery on a phone that has
  # little of either.
  http: ^1.2.0
  shared_preferences: ^2.3.0
  geolocator: ^13.0.0
  flutter_foreground_task: ^8.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
